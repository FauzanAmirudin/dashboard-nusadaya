services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nusadaya}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nusadaya}
      - JWT_SECRET=${JWT_SECRET:-secretkey}
      - REDIS_URL=redis://redis:6379
      - TZ=${TZ:-Asia/Jakarta}
      # Storage di luar source code — persistent via Docker volume
      # Bukan di apps/api/uploads/ (dilarang oleh plan)
      - STORAGE_PATH=/app/storage
      - BACKUP_PATH=/app/backups
    volumes:
      - academic_storage:/app/storage
      - academic_backups:/app/backups
    depends_on:
      - db
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: always
    ports:
      - "3050:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - API_INTERNAL_URL=http://api:3001
    depends_on:
      - api

volumes:
  postgres_data: # Data PostgreSQL
  redis_data: # Data Redis
  academic_storage: # File mahasiswa (students/, temporary/, exports/, dll.)
  academic_backups: # File backup (students/, cohorts/, full/, dll.)

