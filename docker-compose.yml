services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nusadaya}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nusadaya}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nusadaya}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_nusadaya_2026}
      - REDIS_URL=redis://redis:6379
      - TZ=${TZ:-Asia/Jakarta}
      # Connection pool & cache configuration
      - DB_POOL_MAX=${DB_POOL_MAX:-20}
      - CACHE_MAX_MEMORY_KEYS=${CACHE_MAX_MEMORY_KEYS:-2000}
      - CACHE_TTL_STUDENT_LIST=${CACHE_TTL_STUDENT_LIST:-60}
      - CACHE_TTL_DASHBOARD=${CACHE_TTL_DASHBOARD:-120}
      - CACHE_TTL_DETAIL=${CACHE_TTL_DETAIL:-180}
      - CACHE_TTL_DEFAULT=${CACHE_TTL_DEFAULT:-120}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3050}
      # Storage di luar source code — persistent via Docker volume
      - STORAGE_PATH=/app/storage
      - BACKUP_PATH=/app/backups
    volumes:
      - academic_storage:/app/storage
      - academic_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: always
    ports:
      - "3050:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - API_INTERNAL_URL=http://api:3001
    depends_on:
      - api

volumes:
  postgres_data: # Data PostgreSQL
  redis_data: # Data Redis
  academic_storage: # File mahasiswa (students/, temporary/, exports/, dll.)
  academic_backups: # File backup (students/, cohorts/, full/, dll.)
