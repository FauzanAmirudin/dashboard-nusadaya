# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION — ONEDATA NUSADAYA (PRODUCTION SSL)
# ==============================================================================

server_tokens off;

# Rate limit zone global untuk API (60 req/detik)
limit_req_zone $binary_remote_addr zone=onedata_api_limit:10m rate=60r/s;

# Rate limit zone ketat khusus endpoint otentikasi / auth (15 req/menit per IP)
limit_req_zone $binary_remote_addr zone=onedata_auth_limit:10m rate=15r/m;
limit_req_status 429;

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS REDIRECT (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name onedata-nusadaya.com www.onedata-nusadaya.com api.onedata-nusadaya.com;

    # ACME Challenge untuk pembaruan otomatis sertifikat SSL Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /www/server/nginx/html;
        allow all;
    }

    # Redirect seluruh request HTTP lainnya ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. FRONTEND WEB HTTPS (Port 443) — onedata-nusadaya.com & www
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name onedata-nusadaya.com www.onedata-nusadaya.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/onedata-nusadaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onedata-nusadaya.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Batas ukuran upload dokumen & PDF (50 MB)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Anti-spoofing: Timpa X-Forwarded-For dengan $remote_addr asli
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. BACKEND API HTTPS (Port 443) — api.onedata-nusadaya.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name api.onedata-nusadaya.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/onedata-nusadaya.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onedata-nusadaya.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Batas ukuran upload berkas ke API (50 MB)
    client_max_body_size 50M;

    # Proteksi Rate Limiting Ketat khusus rute Auth (Login, OTP Verify, OTP Resend)
    location ~* ^/(api/)?auth/ {
        limit_req zone=onedata_auth_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
    }

    # Rute API Global lainnya
    location / {
        limit_req zone=onedata_api_limit burst=100 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}
