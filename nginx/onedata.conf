# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION — ONEDATA NUSADAYA
# ==============================================================================

# Rate limit zone untuk keamanan API
limit_req_zone $binary_remote_addr zone=onedata_api_limit:10m rate=60r/s;

# 1. FRONTEND WEB — onedata-nusadaya.com & www.onedata-nusadaya.com
server {
    listen 80;
    server_name onedata-nusadaya.com www.onedata-nusadaya.com;

    # Batas ukuran upload dokumen & PDF (50 MB)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}

# 2. BACKEND API — api.onedata-nusadaya.com
server {
    listen 80;
    server_name api.onedata-nusadaya.com;

    # Batas ukuran upload berkas ke API (50 MB)
    client_max_body_size 50M;

    location / {
        limit_req zone=onedata_api_limit burst=100 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}
